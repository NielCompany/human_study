<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>하자 점검 리포트</title>
  <style>
    /* A4 세로, 여백 1cm */
    @page {
      size: A4 portrait;
      margin: 1cm;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Malgun Gothic', sans-serif;
    }

    .wrapper {
      padding: 0.5cm;  /* 전체 컨텐츠 경계 안쪽 여백 */
    }

    .header {
      text-align: center;
      margin-bottom: 0.5cm;
    }
    .header h1 {
      margin: 0;
      font-size: 20pt;
    }
    .header p {
      margin: 0;
      font-size: 9pt;
      color: #666;
    }

    /* 카드 하나를 테이블 형태로, 분할 방지 */
    .report-container {
      display: table;
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #444;
      margin-bottom: 0.5cm;

      /* 내부에서 페이지 나누지 않기 */
      page-break-inside: avoid;
    }

    .column {
      display: table-cell;
      vertical-align: top;
      padding: 8px;
      border-right: 1px solid #444;
    }
    .column:last-child {
      border-right: none;
    }

    /* 비율 조정 */
    .image-section {
      width: 60%;
    }
    .info-section {
      width: 25%;
      font-size: 11pt;
      line-height: 1.4;
    }

    .info-section .label {
      font-weight: bold;
    }
    .info-section .description {
      margin-top: 0.3cm;
    }

    .column img {
      max-width: 70%;
      height: auto;
      display: block;
      margin: 0 auto;
      border: 1px solid #ddd;
    }

    /* Footer는 흐름대로 밑에 붙이기 */
    .footer {
      text-align: center;
      font-size: 7pt;
      color: #aaa;
      margin-top: 1cm;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- 제목과 타임스탬프 -->
    <div class="header">
      <h1>AI 하자 점검 리포트</h1>
      <p>{{ now }}</p>
    </div>

    <!-- items 리스트를 순회하며 카드마다 테이블 생성 -->
    {% for it in items %}
      <div class="report-container">
        <!-- 왼쪽 칸: 이미지 -->
        <div class="column image-section">
          <img src="{{ it.image_url }}" alt="점검 이미지">
        </div>
        <!-- 오른쪽 칸: 대분류 + 설명 -->
        <div class="column info-section">
          <p><span class="label">대분류:</span> {{ it.category }}</p>
          <div class="description">
            <p><span class="label">하자 설명:</span></p>
            <p>{{ it.description | replace('\n','<br>') | safe }}</p>
          </div>
        </div>
      </div>
    {% endfor %}

    <!-- 페이지 마지막에 푸터 -->
    <div class="footer">
      © 2025 AI Defect Checker — www.aidefectchecker.com
    </div>
  </div>
</body>
</html>
