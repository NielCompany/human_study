<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>하자 진단 리포트</title>

  <style>
    /* WeasyPrint 전용 페이지 설정: A4 세로, 여백 1cm */
    @page {
      size: A4 portrait;
      margin: 1cm;
    }

    /* 본문 여백은 없애고, 컨테이너 안에서만 패딩 조절 */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Malgun Gothic', sans-serif;
    }
    .wrapper {
      padding: 0.5cm;  /* 전체 컨텐츠 경계 안쪽 여백 */
    }

    .header {
      background: #111;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    .logo { font-size: 1.2rem; font-weight: bold; }
    .nav a {
      color: #fff;
      margin-left: 1rem;
      text-decoration: none;
      font-weight: 500;
    }
    .download-buttons {
      text-align: center;
      margin: 2rem 0;        /* 위아래 간격 조절 */
    }
    .download-buttons .btn-download {
      margin: 0 0.5rem;      /* 좌우 간격 조절 */
    }

    .btn-download {
      display: inline-block;
      background-color: #000;    /* 검은 배경 */
      color: #fff;               /* 흰 글자 */
      text-decoration: none;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11pt;
      font-weight: bold;
      margin-bottom: 0.3cm;
    }
    .btn-download:hover {
      opacity: 0.8;
    }

    /* 전체 테두리 + 칸 구성 */
    .report-container {
      display: table;
      width: 80%;
      margin: 0 auto;
      border-collapse: collapse;
      /* 테두리 굵기 조절 */
      border: 1px solid #444;
    }
    
    .row {
    display: table-row;
    /* 필요하면 아래로 여백 추가 */
    /* margin-bottom: 0.5cm; */
    }
    .column {
      display: table-cell;
      vertical-align: top;
      /* 양쪽 칸 간격 줄이기 위해 패딩도 살짝 줄임 */
      padding: 8px;
      border-right: 1px solid #444;
    }
    .column:last-child {
      border-right: none;
    }

    /* 가로 비율: 왼쪽 60% / 오른쪽 40% */
    .image-section {
      width: 50%;
    }
    .info-section {
      text-align: center;
      vertical-align: middle;
      width: 50%;
      font-weight: bold;
      font-size: 12pt;
      line-height: 1.4;
    }
    .info-section .label {
      font-weight: bold;
    }
    .info-section .description {
      margin-top: 0.3cm;
    }

    .column img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border: 1px solid #ddd;
    }

    .footer {
      position: fixed;
      right: 0.2cm;
      width: 100%;
      text-align: right;
      font-size: 11pt;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="logo">AI 텍스트 추출</div>
      <nav class="nav">
        <a href="/">홈</a>
        <a href="{{ url_for('login') }}">LOGIN</a>
      </nav>
    </header>
      <div class="download-buttons">
        <a href="{{ url_for('download_docx') }}"
          class="btn-download">
          📝 Word로 다운로드
        </a>
        <!-- <a href="{{ url_for('download_ocr_pdf') }}"
          target="_blank"
          class="btn-download">
          📄 PDF로 다운로드
        </a> -->
      </div>
      <p>{{ now }}</p>
    </div>
    {% for item in results %}
        <div class="report-container">
            <div class="row">
                <!-- 왼쪽 칸: 이미지 (60%) -->
                <div class="column image-section">
                    <img src="{{ item.image_url }}" alt="점검 이미지">
                </div>
                <div class="column info-section">
                    {% for key, val in item.pairs %}
                        <p><span class="label"></span>{{ key }} : {{ val }}</p>
                    {% endfor %}
                </div>
            </div>
        </div>
    {% endfor %}
  </div>
</body>
</html>
